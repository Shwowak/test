name: HomeOS Docker Image

on:
  push:
    branches: [main, claude/zen-cray-34x5xu]
    paths: ['homeos/**', '.github/workflows/homeos-docker.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: homeos-docker
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: homeos
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/shwowak/homeos:${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Multi-Arch-Manifest fuer latest
        run: |
          IMG=ghcr.io/shwowak/homeos
          docker buildx imagetools create -t $IMG:latest -t $IMG:sha-${GITHUB_SHA::7} $IMG:amd64 $IMG:arm64
