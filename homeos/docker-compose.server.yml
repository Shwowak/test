services:
  homeos:
    image: ghcr.io/shwowak/homeos:latest
    container_name: homeos
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HOMEOS_ADMIN_USER: ${HOMEOS_ADMIN_USER:-admin}
      HOMEOS_ADMIN_PASSWORD: ${HOMEOS_ADMIN_PASSWORD:?HOMEOS_ADMIN_PASSWORD in .env setzen}
      HOMEOS_SECURE_COOKIE: ${HOMEOS_SECURE_COOKIE:-false}
      TZ: Europe/Berlin
    volumes:
      - homeos-data:/data
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: containrrr/watchtower
    container_name: homeos-watchtower
    restart: unless-stopped
    command: --label-enable --cleanup --interval 300
    environment:
      TZ: Europe/Berlin
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro

volumes:
  homeos-data:
