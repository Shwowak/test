<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<style>
  html, body { margin: 0; height: 100%; background: transparent; color: var(--text, #e2e8f0); font-family: var(--font, system-ui, sans-serif); overflow: hidden; user-select: none; }
  svg { width: 100%; height: 100%; display: block; }
  .lbl { fill: var(--dim, #94a3b8); font-size: 13px; letter-spacing: .15em; text-transform: uppercase; }
  .val { fill: var(--text, #e2e8f0); font-size: 22px; }
  .ic { font-size: 30px; }
  .ring { fill: rgba(2, 6, 23, .95); stroke-width: 2; }
  .line { fill: none; stroke: rgba(148, 163, 184, .18); stroke-width: 3; }
  .flow { fill: none; stroke-width: 3; stroke-dasharray: 2 14; stroke-linecap: round; animation: run 1s linear infinite; filter: drop-shadow(0 0 4px currentColor); }
  .flow.rev { animation-direction: reverse; }
  @keyframes run { to { stroke-dashoffset: -16; } }
  .empty { display: flex; height: 100%; align-items: center; justify-content: center; text-align: center; padding: 16px; color: var(--dim, #94a3b8); }
</style>
</head>
<body>
<div id="app" class="empty">…</div>
<script src="/api/v1/plugins/sdk.js"></script>
<script>
  const C = { pv: '#fbbf24', grid: '#a78bfa', battery: '#34d399', house: '#22d3ee' }
  const fmt = w => w === null || w === undefined ? '—' : Math.abs(w) >= 1000 ? (Math.abs(w) / 1000).toFixed(1) + ' kW' : Math.round(Math.abs(w)) + ' W'
  function node(x, y, color, icon, label, value, sub, side) {
    const tx = side ? x + 62 : x, anchor = side ? 'start' : 'middle'
    return `<circle class="ring" cx="${x}" cy="${y}" r="46" stroke="${color}" style="filter:drop-shadow(0 0 8px ${color}66)"/>
      <text x="${x}" y="${y + 10}" text-anchor="middle" class="ic">${icon}</text>
      <text x="${tx}" y="${side ? y + 18 : y + 74}" text-anchor="${anchor}" class="val">${value}</text>
      <text x="${tx}" y="${side ? y - 10 : y + 98}" text-anchor="${anchor}" class="lbl">${label}${sub ? ' · ' + sub : ''}</text>`
  }
  function link(a, b, w, color, active) {
    const d = `M${a[0]},${a[1]} L${b[0]},${b[1]}`
    return `<path class="line" d="${d}"/>` + (active ? `<path class="flow ${w < 0 ? 'rev' : ''}" d="${d}" stroke="${color}" style="color:${color};animation-duration:${Math.max(0.35, 2 - Math.min(Math.abs(w), 8000) / 5000)}s"/>` : '')
  }
  SmartBoard.onData(data => {
    const app = document.getElementById('app')
    const lang = SmartBoard.state.lang
    const e = data.energy
    if (!e || !e.configured) { app.className = 'empty'; app.textContent = lang === 'en' ? 'Choose devices in Settings → Plugins → Energy.' : 'Geräte unter Einstellungen → Plugins → Energie auswählen.'; return }
    const p = e.power
    const L = lang === 'en' ? { pv: 'Solar', grid: 'Grid', bat: 'Battery', house: 'Home' } : { pv: 'Solar', grid: 'Netz', bat: 'Batterie', house: 'Haus' }
    const H = [300, 210], PV = [300, 56], G = [90, 210], B = [510, 210]
    const on = w => w !== null && Math.abs(w) > 5
    app.className = ''
    app.innerHTML = `<svg viewBox="0 0 600 330" preserveAspectRatio="xMidYMid meet">
      ${p.pv !== null ? link(PV, H, p.pv, C.pv, on(p.pv)) : ''}
      ${p.grid !== null ? link(G, H, p.grid, C.grid, on(p.grid)) : ''}
      ${p.battery !== null ? link(H, B, p.battery, C.battery, on(p.battery)) : ''}
      ${p.pv !== null ? node(...PV, C.pv, '☀', L.pv, fmt(p.pv), '', true) : ''}
      ${p.grid !== null ? node(...G, C.grid, '⚡', L.grid, fmt(p.grid), p.grid < -5 ? '↑' : p.grid > 5 ? '↓' : '') : ''}
      ${p.battery !== null || p.soc !== null ? node(...B, C.battery, '🔋', L.bat, fmt(p.battery), p.soc !== null ? Math.round(p.soc) + ' %' : '') : ''}
      ${node(...H, C.house, '⌂', L.house, fmt(p.house))}
    </svg>`
  })
</script>
</body>
</html>
